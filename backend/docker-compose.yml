services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    ports:
      - "5434:5432" # 5432 занят локальным PostgreSQL, 5433 — taxi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      PORT: 5100
      DATABASE_URL: postgres://erp:erp@postgres:5432/erp
    ports:
      - "5100:5100"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
