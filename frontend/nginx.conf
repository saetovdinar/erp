# Конфиг nginx для продакшн-сборки фронта: статика из dist + прокси API
# на контейнер api (имя сервиса из docker-compose.prod.yml).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-роутинг: неизвестные пути отдаём index.html
    location / {
        try_files $uri /index.html;
    }

    # API (фронт ходит по относительным /v1) — на backend-контейнер
    location /v1/ {
        proxy_pass http://api:5100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
